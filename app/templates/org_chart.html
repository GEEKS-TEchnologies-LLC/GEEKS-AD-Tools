<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizational Chart - GEEKS-AD-Plus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            background: #181818;
            color: #ffd700;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            overflow-x: auto;
        }
        
        .org-chart-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 18px;
            padding: 20px;
            min-height: 600px;
        }
        
        .org-chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .org-chart-header h1 {
            background: linear-gradient(90deg, #ffd700, #ffb347);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .btn-custom {
            background: linear-gradient(135deg, #ffd700 0%, #ffb347 100%);
            border: none;
            color: #000;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3);
        }
        
        #org-chart-svg {
            width: 100%;
            height: 100vh;
            min-height: 800px;
            background: rgba(0, 0, 0, 0.2);
        }
        
        .node {
            cursor: pointer;
        }
        
        .node rect {
            fill: rgba(255, 215, 0, 0.1);
            stroke: #ffd700;
            stroke-width: 2;
            rx: 8;
        }
        
        .node.manager rect {
            fill: rgba(255, 215, 0, 0.2);
            stroke-width: 3;
        }
        
        .node.root rect {
            fill: rgba(255, 215, 0, 0.3);
            stroke: #ffb347;
            stroke-width: 4;
        }
        
        .node text {
            fill: #ffd700;
            font-size: 12px;
            font-weight: 500;
        }
        
        .node text.name {
            font-weight: 700;
            font-size: 14px;
        }
        
        .node text.title {
            font-size: 10px;
            fill: rgba(255, 215, 0, 0.7);
        }
        
        .link {
            fill: none;
            stroke: #ffd700;
            stroke-width: 2;
        }
        
        .link.dotted {
            stroke-dasharray: 5, 5;
            stroke: rgba(255, 215, 0, 0.5);
        }
        
        .link.indirect {
            stroke: rgba(255, 215, 0, 0.3);
            stroke-width: 1;
        }
        
        .node:hover rect {
            fill: rgba(255, 215, 0, 0.3);
            stroke: #ffb347;
        }
        
        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #ffd700;
            border-radius: 8px;
            padding: 10px;
            color: #ffd700;
            font-size: 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .tooltip.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="org-chart-container">
        <div class="org-chart-header">
            <h1><i class="fas fa-sitemap"></i> Organizational Chart</h1>
            <a href="/admin/managers" class="btn btn-custom">
                <i class="fas fa-arrow-left"></i> Back to Managers
            </a>
        </div>
        
        <div class="controls">
            <button class="btn btn-custom" onclick="resetZoom()">
                <i class="fas fa-search"></i> Reset Zoom
            </button>
            <button class="btn btn-custom" onclick="toggleDottedLines()">
                <i class="fas fa-link"></i> Toggle Dotted Lines
            </button>
            <button class="btn btn-custom" onclick="expandAll()">
                <i class="fas fa-expand"></i> Expand All
            </button>
            <button class="btn btn-custom" onclick="collapseAll()">
                <i class="fas fa-compress"></i> Collapse All
            </button>
        </div>
        
        <svg id="org-chart-svg"></svg>
    </div>
    
    <div class="tooltip" id="tooltip"></div>
    
    <script>
        const orgData = {{ root_nodes | tojson }};
        const dottedLines = {{ dotted_lines | tojson }};
        let showDottedLines = true;
        
        const margin = { top: 50, right: 200, bottom: 50, left: 200 };
        const nodeWidth = 200;
        const nodeHeight = 100;
        const horizontalSpacing = 300;  // Horizontal spacing between levels
        const verticalSpacing = 150;    // Vertical spacing between siblings
        
        const svg = d3.select("#org-chart-svg");
        const width = window.innerWidth - 40;
        const height = Math.max(800, window.innerHeight - 100);
        
        svg.attr("width", width).attr("height", height);
        
        const g = svg.append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);
        
        const zoom = d3.zoom()
            .scaleExtent([0.1, 3])
            .on("zoom", (event) => {
                g.attr("transform", event.transform);
            });
        
        svg.call(zoom);
        
        const tooltip = d3.select("#tooltip");
        
        // Create tree layout with better spacing
        const tree = d3.tree()
            .nodeSize([verticalSpacing, horizontalSpacing])
            .separation((a, b) => {
                // Better separation: siblings get more space
                if (a.parent === b.parent) {
                    return 1.2;  // Siblings
                }
                return 1.5;  // Different parents
            });
        
        // Convert data to hierarchy - handle multiple root nodes
        function buildHierarchy(rootNodes) {
            const nodeMap = new Map();
            const roots = [];
            
            // First, collect all nodes from all root nodes and their descendants
            function collectNodes(node) {
                if (!nodeMap.has(node.username)) {
                    const hierarchyNode = {
                        data: node,
                        children: []
                    };
                    nodeMap.set(node.username, hierarchyNode);
                    
                    // Recursively collect children
                    if (node.children && node.children.length > 0) {
                        node.children.forEach(child => {
                            collectNodes(child);
                            hierarchyNode.children.push(nodeMap.get(child.username));
                        });
                    }
                }
            }
            
            // Collect all nodes starting from root nodes
            rootNodes.forEach(rootNode => {
                collectNodes(rootNode);
                roots.push(nodeMap.get(rootNode.username));
            });
            
            // If we have multiple roots, create a virtual root to contain them all
            if (roots.length > 1) {
                return {
                    data: { username: 'virtual_root', display_name: 'Organization', title: '', department: '' },
                    children: roots
                };
            } else if (roots.length === 1) {
                return roots[0];
            } else {
                return { data: { username: 'root', display_name: 'No Data', children: [] }, children: [] };
            }
        }
        
        const root = d3.hierarchy(buildHierarchy(orgData), d => d.children);
        tree(root);
        
        // Calculate bounds and adjust view
        const bounds = root.descendants().reduce((acc, d) => {
            return {
                left: Math.min(acc.left, d.y),
                right: Math.max(acc.right, d.y),
                top: Math.min(acc.top, d.x),
                bottom: Math.max(acc.bottom, d.x)
            };
        }, { left: Infinity, right: -Infinity, top: Infinity, bottom: -Infinity });
        
        const treeWidth = bounds.right - bounds.left;
        const treeHeight = bounds.bottom - bounds.top;
        
        // Center the tree
        let initialX = (width - margin.left - margin.right - treeWidth) / 2 - bounds.left;
        let initialY = (height - margin.top - margin.bottom - treeHeight) / 2 - bounds.top;
        
        // Apply initial transform to center the tree
        g.attr("transform", `translate(${initialX + margin.left},${initialY + margin.top})`);
        
        // Store initial transform for reset
        window.orgChartInitialTransform = { x: initialX + margin.left, y: initialY + margin.top };
        
        // Draw links
        const links = g.selectAll(".link")
            .data(root.links())
            .enter()
            .append("path")
            .attr("class", "link")
            .attr("d", d3.linkHorizontal()
                .x(d => d.y)
                .y(d => d.x));
        
        // Draw nodes
        const node = g.selectAll(".node")
            .data(root.descendants())
            .enter()
            .append("g")
            .attr("class", d => {
                let classes = "node";
                if (d.depth === 0) classes += " root";
                if (d.children && d.children.length > 0) classes += " manager";
                return classes;
            })
            .attr("transform", d => `translate(${d.y},${d.x})`)
            .on("mouseover", function(event, d) {
                const data = d.data.data || d.data;
                tooltip
                    .html(`
                        <strong>${data.display_name || data.name}</strong><br>
                        ${data.title ? data.title + '<br>' : ''}
                        ${data.department ? 'Dept: ' + data.department + '<br>' : ''}
                        ${data.username ? 'User: ' + data.username : ''}
                    `)
                    .style("left", (event.pageX + 10) + "px")
                    .style("top", (event.pageY - 10) + "px")
                    .classed("visible", true);
            })
            .on("mouseout", function() {
                tooltip.classed("visible", false);
            });
        
        // Draw node rectangles
        node.append("rect")
            .attr("width", nodeWidth)
            .attr("height", nodeHeight)
            .attr("x", -nodeWidth / 2)
            .attr("y", -nodeHeight / 2);
        
        // Draw node text
        node.append("text")
            .attr("class", "name")
            .attr("x", 0)
            .attr("y", -20)
            .attr("text-anchor", "middle")
            .text(d => {
                const data = d.data.data || d.data;
                return data.display_name || data.name || data.username;
            });
        
        node.append("text")
            .attr("class", "title")
            .attr("x", 0)
            .attr("y", 0)
            .attr("text-anchor", "middle")
            .text(d => {
                const data = d.data.data || d.data;
                return data.title || '';
            });
        
        node.append("text")
            .attr("class", "title")
            .attr("x", 0)
            .attr("y", 15)
            .attr("text-anchor", "middle")
            .text(d => {
                const data = d.data.data || d.data;
                return data.department || '';
            });
        
        // Draw dotted lines
        function drawDottedLines() {
            g.selectAll(".link.dotted").remove();
            if (showDottedLines && dottedLines.length > 0) {
                // This would require additional logic to find node positions
                // For now, we'll skip this as it requires more complex positioning
            }
        }
        
        function resetZoom() {
            const transform = window.orgChartInitialTransform || { x: margin.left, y: margin.top };
            svg.transition().duration(750).call(
                zoom.transform,
                d3.zoomIdentity.translate(transform.x, transform.y)
            );
        }
        
        function toggleDottedLines() {
            showDottedLines = !showDottedLines;
            drawDottedLines();
        }
        
        function expandAll() {
            // Expand all nodes (if we implement collapsible tree)
        }
        
        function collapseAll() {
            // Collapse all nodes (if we implement collapsible tree)
        }
        
        // Initial render
        drawDottedLines();
    </script>
</body>
</html>
